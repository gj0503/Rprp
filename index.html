<script>
'use strict';
const data=JSON.parse(document.querySelector('#catalog').textContent);
const courses=Object.fromEntries(data.courses.map(c=>[c.id,c]));

const fields={study:{watch:'수강',review:'복습',practice:'문제풀이'},robot:{prep:'선학습',teach:'혜원언니 수업',self:'내 실습',partner:'혜원언니 실습',joint:'공동 적용'}};
const storageKey='rprp-learning-dashboard-v1';
const dayMs=86400000;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const monday=s=>iso(date(s)-((new Date(date(s)).getUTCDay()+6)%7)*dayMs);
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());
const day=(start,n)=>iso(date(start)+n*dayMs);
const fresh=()=>({version:1,start:monday(today()),marks:Object.fromEntries(Object.values(lessons).filter(x=>x.initial).map(x=>[x.id,{watch:true}])),notes:{},milestones:{},plans:{},holds:{}});
let state=fresh();
let tab='week', week=0, selected={study:'calc',robot:'robot01'}, query='',filter='all';
const object=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
const taskKey=t=>t.id+'/'+t.field;
const complete=t=>!!state.marks[t.id]?.[t.field];
const held=c=>state.holds[c.id]??!!c.hold;
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(date(s))&&iso(date(s))===s;
function validate(raw){
 if(!object(raw)||raw.version!==1||!validDate(raw.start)||monday(raw.start)!==raw.start) throw Error('지원되는 진도 백업 파일을 선택해 주세요.');
 for(const key of ['marks','notes','milestones','plans','holds']) if(!object(raw[key])) throw Error('백업에 필요한 항목이 빠져 있습니다.');
 for(const [id,record] of Object.entries(raw.marks)){
  if(!Object.hasOwn(lessons,id)||!object(record)||Object.entries(record).some(([key,value])=>!Object.hasOwn(fields[lessons[id].course.kind],key)||typeof value!=='boolean')) throw Error('강의 체크 기록을 확인해 주세요.');
 }
 for(const [id,value] of Object.entries(raw.notes)) if(!Object.hasOwn(lessons,id)||typeof value!=='string') throw Error('메모 형식을 확인해 주세요.');
 for(const [id,value] of Object.entries(raw.milestones)) if(!data.road.some(r=>r.id===id)||typeof value!=='boolean') throw Error('로드맵 기록을 확인해 주세요.');
 for(const [id,value] of Object.entries(raw.holds)) if(!Object.hasOwn(courses,id)||courses[id].kind!=='study'||typeof value!=='boolean') throw Error('과목 보류 기록을 확인해 주세요.');
 for(const [key,plan] of Object.entries(raw.plans)){
  if(!/^\d+$/.test(key)||!Array.isArray(plan)||plan.some(t=>!object(t)||!Object.hasOwn(lessons,t.id)||!Object.hasOwn(fields[lessons[t.id].course.kind],t.field)||!Number.isInteger(t.day)||t.day<0||t.day>6||!Number.isFinite(t.cost)||t.cost<0||typeof t.slot!=='string')) throw Error('주간 계획 형식을 확인해 주세요.');
 }
 return raw;
}
function save(){
 try{localStorage.setItem(storageKey,JSON.stringify(state));$('#save').textContent='자동 저장됨';}
 catch{$('#save').textContent='자동 저장 실패 · JSON으로 백업해 주세요';}
}
try{const saved=localStorage.getItem(storageKey);if(saved) state=validate(JSON.parse(saved));}
catch{$('#save').textContent='저장된 기록을 불러오지 못했습니다';}
const firstRobot=[

 {id:'robot03',name:'C언어',test:x=>+x.n<=14},
 {id:'robot02',name:'Linux/Git',test:()=>true},
 {id:'robot03',name:'C++',test:x=>+x.n>14}
];
const order=['calc','linear','algebra','python','phy0','phy3','calc3','calc4','calc5','calc6','calc7','calc8','uni13','uni14','uni15','uni16','statics'];
const cost=x=>x.minutes??(x.course.id==='python'?20:50);
const label=x=>x.n==='OT'?'OT':x.course.kind==='study'?x.n+'강':x.n+'번';
function makePlan(index,previous){
 const plan=[];
 const seen=new Set();
 const add=(id,field,day,cost,slot,carry=false)=>{
  const t={id,field,day,cost,slot,carry};
  if(!seen.has(taskKey(t))&&!complete(t)){plan.push(t);seen.add(taskKey(t));}
 };
 const capacity=[240,240,240,180,180];
 const remaining=[...capacity];
 const robotRemaining=Array.from({length:7},(_,d)=>d<5?60:120);
 const unfinished=previous.filter(t=>!complete(t));
 const sticky=unfinished.filter(t=>lessons[t.id].course.kind==='study'&&!held(lessons[t.id].course));
 const focus=[...new Set(sticky.map(t=>lessons[t.id].course.id))].slice(0,2);
 for(const id of order){
  if(focus.length<2&&!focus.includes(id)&&!held(courses[id])&&courses[id].items.some(x=>!x.skip&&(!state.marks[x.id]?.watch||x.review&&!state.marks[x.id]?.review))) focus.push(id);
 }
 function scheduleStudy(x,field,carry){
  const duration=field==='review'?Math.min(40,cost(x)):cost(x);
  const d=remaining.findIndex((m,i)=>m>=duration&& !plan.some(t=>t.day===i&&t.id===x.id&&t.field!==field));
  if(d<0||seen.has(x.id+'/'+field)||complete({id:x.id,field}))return;
  add(x.id,field,d,duration,'대학원',carry);
  remaining[d]-=duration;
 }
 for(const t of sticky) if(focus.includes(lessons[t.id].course.id))scheduleStudy(lessons[t.id],t.field,true);
 const queues=focus.map(id=>courses[id].items.filter(x=>!x.skip).flatMap(x=>{
  if(x.review&&!state.marks[x.id]?.review)return [[lessons[x.id],'review']];
  return state.marks[x.id]?.watch?[]:[[lessons[x.id],'watch']];
 }));
 for(let n=0;n<Math.max(0,...queues.map(q=>q.length));n++)for(const q of queues)if(q[n])scheduleStudy(...q[n],false);
 const later=data.courses.filter(c=>c.kind==='robot'&&!['robot01','robot02','robot03'].includes(c.id));
 const track=firstRobot[index]??{id:(later.find(c=>c.items.some(x=>!state.marks[x.id]?.teach))??later.at(-1)).id,test:()=>true};
 const prepDays=index<2?[3,4,5]:[0,1,2,3,4];
 const lessonDays=[5,6];
 const robotUnits=courses[track.id].items.filter(track.test).filter(x=>!state.marks[x.id]?.teach&&!seen.has(x.id+'/teach'));
 for(const x of robotUnits){
  const p=prepDays.find(d=>robotRemaining[d]>=20);
  const d=lessonDays.find(d=>robotRemaining[d]>=25);
  if(d===undefined||(!state.marks[x.id]?.prep&&!seen.has(x.id+'/prep')&&p===undefined))continue;
  if(!state.marks[x.id]?.prep&&!seen.has(x.id+'/prep')){add(x.id,'prep',p,20,index<2?'오전 복습':'선학습');robotRemaining[p]-=20;}
  if(robotRemaining[d]>=25){add(x.id,'teach',d,25,d===5?'오후 혜원언니 수업':'혜원언니 수업');robotRemaining[d]-=25;}
 }
 for(const t of unfinished.filter(t=>lessons[t.id].course.kind==='robot')){
  const options=t.field==='teach'?lessonDays:prepDays;
  const d=options.find(d=>robotRemaining[d]>=t.cost);
  if(d!==undefined){add(t.id,t.field,d,t.cost,t.field==='teach'?'혜원언니 수업':'오전 준비',true);robotRemaining[d]-=t.cost;}
 }
 // Keep overflow in the backlog until there is room in a later week.
 for(const t of unfinished)if(!seen.has(taskKey(t)))plan.push({...t,day:6,carry:true,slot:'이월 대기'});

}
function planFor(index){
 for(let i=0;i<=index;i++){
  if(Object.hasOwn(state.plans,i))continue;
  state.plans[i]=makePlan(i,state.plans[i-1]??[]);
 }

}
const ratio=(a,b)=>b?Math.round(100*a/b):0;
function courseDone(x,c){return !!state.marks[x.id]?.[c.kind==='study'?'watch':'joint'];}
function stats(plan){
 const stat=(label,value)=>'<div class="stat"><strong>'+value+'%</strong><small>'+label+'</small></div>';
 const study=data.courses.filter(c=>c.kind==='study'&&!held(c)).flatMap(c=>c.items).filter(x=>!x.skip);
 const robotics=data.courses.filter(c=>c.kind==='robot').flatMap(c=>c.items);
 const scheduled=plan.filter(t=>t.slot!=='이월 대기');

}

 const task=t=>{
  const x=lessons[t.id], kind=x.course.kind;
  return '<label class="task '+kind+'">'+check(t.id,t.field,x.t+' '+fields[kind][t.field])+'<span><small>'+esc(t.slot)+' · '+esc(x.course.name)+' · '+label(x)+'</small>'+esc(x.t)+'<small>'+fields[kind][t.field]+' · '+(t.slot==='이월 대기'?'':(kind==='robot'||x.minutes===null||t.field==='review'?'약 ':'')+t.cost+'분')+(t.carry?' · 이월':'')+'</small></span></label>';
 };
 return '<section class="panel"><div class="toolbar"><div><h2>'+(week+1)+'주차 · '+start.slice(5).replace('-','.')+'–'+day(start,6).slice(5).replace('-','.')+'</h2><p class="muted">프로젝트 집중 · '+focus+'</p></div><div class="pills"><button data-step="-1" '+(!week?'disabled':'')+'>‹ 이전</button><button data-now>이번 주</button><button data-step="1">다음 ›</button></div></div><div class="toolbar"><span class="now">'+done+' / '+scheduled.length+' 완료 · '+ratio(done,scheduled.length)+'%</span><details class="settings"><summary>계획 설정</summary><label>첫 주 시작일 <input type="date" id="start" value="'+state.start+'"></label> <button id="apply-start">적용</button> <button id="replan">이번 주 다시 배정</button></details></div><progress class="progress" aria-label="주간 완료율" max="'+(scheduled.length||1)+'" value="'+done+'"></progress><div class="calendar">'+weekdays.map((name,i)=>{
  const tasks=scheduled.filter(t=>t.day===i);
  const local=day(start,i);
  const study=tasks.filter(t=>lessons[t.id].course.kind==='study').reduce((a,t)=>a+t.cost,0);
  return '<article class="day '+(i>4?'weekend ':'')+(local===today()?'today':'')+'"><header><b>'+name+'요일</b> <small>'+local.slice(5).replace('-','.')+'</small></header><p class="muted">'+(i<5?'대학원 '+study+'분 · 목표 '+(i<3?'3–5시간':'3시간'):'혜원언니 교육')+'</p>'+(tasks.length?tasks.map(task).join(''):'<p class="muted">예정 항목 없음</p>')+'</article>';
 }).join('')+'</div>'+(backlog.length?'<details class="note"><summary>이월 대기 '+backlog.length+'개</summary>'+backlog.map(task).join('')+'</details>':'')+'</section>';
}
function catalogView(kind){
 const list=data.courses.filter(c=>c.kind===kind);
 const c=courses[selected[kind]];
 return '<div class="layout"><aside class="panel course-list" aria-label="과목">'+list.map(c=>{
  const eligible=c.items.filter(x=>!x.skip);
  const done=eligible.filter(x=>courseDone(x,c)).length;
  return '<button data-course="'+c.id+'" class="'+(selected[kind]===c.id?'active':'')+'">'+esc(c.name)+'<small>'+done+' / '+eligible.length+' 완료'+(kind==='study'&&held(c)?' · 보류':'')+'</small><progress aria-label="과목 완료율" max="'+eligible.length+'" value="'+done+'"></progress></button>';
 }).join('')+'</aside><section class="panel"><div class="toolbar"><div><h2>'+esc(c.name)+'</h2><p class="muted">'+c.items.length+'개 '+(kind==='study'?'강의':'단원')+'</p></div>'+(kind==='study'?'<button data-hold="'+c.id+'">'+(held(c)?'보류 해제':'과목 보류')+'</button>':'')+'</div>'+(held(c)?'<p class="note">'+(c.id==='statics'?'전공 수학 보완까지 학습 보류':'주간 자동 배정 보류')+'</p>':'')+'<div class="toolbar"><input id="search" class="filter" type="search" placeholder="회차·제목 검색" aria-label="회차·제목 검색" value="'+esc(query)+'"><select id="filter" aria-label="상태 필터"><option value="all">전체</option><option value="todo">미완료</option><option value="done">완료</option>'+(kind==='study'?'<option value="skip">생략 추천</option><option value="review">복습 필요</option>':'')+'</select></div><div class="entries" id="entries"></div></section></div>';
}
function entries(){
 const c=courses[selected[tab]];
 const result=c.items.filter(x=>{
  const matches=(label({...x,course:c})+' '+x.t).toLowerCase().includes(query.trim().toLowerCase());
  const done=courseDone(x,c);
  return matches&&(filter==='all'||filter==='todo'&&!done||filter==='done'&&done||filter==='skip'&&x.skip||filter==='review'&&x.review&&!state.marks[x.id]?.review);
 });
 $('#entries').innerHTML=result.map(x=>{
  const tags=(x.skip?'<span class="badge amber">× 생략 추천</span>':'')+(x.review&&!state.marks[x.id]?.review?'<span class="badge blue">복습 필요</span>':'');
  return '<article class="entry"><div class="pills"><span class="badge">'+label({...x,course:c})+'</span><strong>'+esc(x.t)+'</strong>'+(c.kind==='study'?'<small>'+(x.minutes===null?'시간 미기재':x.minutes+'분')+'</small>':'')+tags+'</div><div class="checks">'+Object.entries(fields[c.kind]).map(([field,title])=>'<label>'+check(x.id,field,x.t+' '+title)+title+'</label>').join('')+'</div><details><summary>학습 메모'+(state.notes[x.id]?' · 기록 있음':'')+'</summary><textarea data-note="'+x.id+'" aria-label="'+esc(x.t)+' 학습 메모">'+esc(state.notes[x.id])+'</textarea></details></article>';
 }).join('')||'<p class="empty muted">조건에 맞는 항목이 없습니다.</p>';
}
function roadView(){
 const names=['이동 로봇 기초','자율주행·생수 운반','상품 인식·집기·진열','통합·안전·매장 검증'];
 const limits=[0,10,18,26,32];
 return '<div class="road">'+names.map((name,i)=>'<section class="panel"><h3>'+(i+1)+'학기 · '+name+'</h3>'+data.road.slice(limits[i],limits[i+1]).map(r=>{
  const pending=r.deps.filter(id=>!state.milestones[id]);
  return '<article class="entry"><strong>'+r.id+' '+esc(r.name)+'</strong><small>선수 과목 · '+(r.deps.join(', ')||'없음')+'</small><div class="checks"><label><input type="checkbox" data-road="'+r.id+'" '+(state.milestones[r.id]?'checked':'')+'>완료</label>'+(pending.length?'<span class="badge amber">선수 미완료</span>':'')+'</div></article>';
 }).join('')+'</section>').join('')+'</div>';
}
function currentWeek(){return Math.min(260,Math.max(0,Math.floor((date(today())-date(state.start))/(dayMs*7))));}
function render(){
 const plan=planFor(week);
 stats(plan);
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',String(tab===b.dataset.tab)));
 $('#view').innerHTML=tab==='week'?weekView(plan):tab==='road'?roadView():catalogView(tab);
 if(tab==='study'||tab==='robot'){$('#filter').value=filter;entries();}
}
document.querySelector('nav').addEventListener('click',e=>{
 const b=e.target.closest('[data-tab]');if(!b)return;
 tab=b.dataset.tab;query='';filter='all';render();
});
$('#view').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.course){selected[tab]=b.dataset.course;query='';filter='all';}
 else if(b.dataset.step)week=Math.min(260,Math.max(0,week+Number(b.dataset.step)));
 else if(b.hasAttribute('data-now'))week=currentWeek();
 else if(b.dataset.hold){const id=b.dataset.hold;state.holds[id]=!held(courses[id]);for(const k of Object.keys(state.plans))if(+k>=week)delete state.plans[k];}
 else if(b.id==='apply-start'){
  const value=$('#start').value;if(!validDate(value))return;
  if(monday(value)!==state.start&&confirm('시작 주를 바꾸면 주간 배정을 새로 만듭니다. 적용할까요?')){state.start=monday(value);state.plans={};week=0;}
 }
 else if(b.id==='replan'){for(const k of Object.keys(state.plans))if(+k>=week)delete state.plans[k];}
 else return;
 render();save();
});
$('#view').addEventListener('change',e=>{
 const el=e.target,{id,field,road}=el.dataset;
 if(el.id==='filter'){filter=el.value;entries();return;}
 if(id&&field){state.marks[id]??={};state.marks[id][field]=el.checked;}
 else if(road)state.milestones[road]=el.checked;
 else return;
 const entry=el.closest('.entry');
 const open=entry?.querySelector('details')?.open;
 const position=tab==='week'?[...$('#view').querySelectorAll('input[type=checkbox]')].indexOf(el):-1;
 render();save();
 const replacement=position>=0?$('#view').querySelectorAll('input[type=checkbox]')[position]:id?$('#view').querySelector('[data-id="'+id+'"][data-field="'+field+'"]'):$('#view').querySelector('[data-road="'+road+'"]');
 if(open&&replacement)replacement.closest('.entry').querySelector('details').open=true;
 replacement?.focus({preventScroll:true});
});
$('#view').addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='search'){query=el.value;entries();}
 if(el.dataset.note){state.notes[el.dataset.note]=el.value;save();}
});
$('#backup').onclick=()=>{
 const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download='rprp-progress-'+today()+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$('#restore').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
 const file=e.target.files[0];e.target.value='';
 if(!file)return;
 try{
  const restored=validate(JSON.parse(await file.text()));
  if(!confirm('현재 기록을 이 백업으로 교체할까요?'))return;
  state=restored;week=currentWeek();render();save();
 }catch(error){alert(error instanceof SyntaxError?'JSON 파일을 읽을 수 없습니다.':error.message);}
};
week=currentWeek();render();save();
</script>
</body>
</html>
