
<style>
#study-dream-photo {
  margin: 20px 0;
  padding: 18px;
  border-radius: 20px;
  background: #fffaf5;
  border: 1px solid #eadfd4;
}

#study-dream-photo h3 {
  margin: 0 0 6px;
  color: #4c4038;
}

#study-dream-photo p {
  color: #817268;
  font-size: 13px;
}

#study-dream-photo img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 15px;
}

.dream-labels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 12px;
}

.dream-labels article {
  background: #f7f0ea;
  padding: 15px;
  border-radius: 13px;
}

.dream-labels b {
  color: #59473c;
}

@media(max-width:600px) {
  .dream-labels {
    grid-template-columns: 1fr;
  }
}
</style>

<script>
(() => {
  const week = document.getElementById("w2");
  if (!week) return;

  // 이전에 추가한 별도 미래 탭 제거
  document.querySelectorAll(
    '#dreams, .vision-preview, ' +
    '.tabs [data-x="dreams"], ' +
    '.side-nav [data-target="dreams"]'
  ).forEach(el => el.remove());

  if (document.getElementById("study-dream-photo")) return;

  const section = document.createElement("section");
  section.id = "study-dream-photo";

  section.innerHTML = `
    <h3>내가 공부해서 만들 미래</h3>
    <p>오늘의 작은 공부가 내가 원하는 삶을 만든다.</p>

    <img src="./future_goals.webp"
         alt="한강뷰 주택과 대치동 학원 미래 이미지">

    <div class="dream-labels">
      <article>
        <b>한강뷰 주택에서 살기</b>
        <p>
          논현동 아펠바움 같은 분위기의 집.
          내가 만든 로봇과 함께하는 여유로운 삶.
        </p>
      </article>

      <article>
        <b>대치동에 큰 학원 세우기</b>
        <p>
          목동 씨앤씨처럼 규모와 체계를
          갖춘 학원을 운영하는 장기 목표.
        </p>
      </article>
    </div>
  `;

  const lower = week.querySelector(".dashboard-lower");

  if (lower) {
    week.insertBefore(section, lower);
  } else {
    week.appendChild(section);
  }
})();
</script>
