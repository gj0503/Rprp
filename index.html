
<!-- 10월 26일~11월 1일 학습 계획 업데이트 -->
<script>
(() => {
  "use strict";

  const SAVE_KEY = "robotdash-1005-1011-corrected-v1";
  const oldWeek = document.getElementById("w2");

  if (!oldWeek) {
    console.warn("기존 주간 계획 탭을 찾을 수 없습니다.");
    return;
  }

  // 이미 최신 주차가 적용되어 있다면 중복 실행하지 않음
  if (document.getElementById("w1026_la12")) return;

  // 기존 주간 계획 및 체크박스 ID를 그대로 보존
  const history = oldWeek.cloneNode(true);
  history.id = "pastweek";
  history.classList.remove("on");

  const oldTitle = history.querySelector("h2");
  if (oldTitle) {
    oldTitle.textContent = "지난주 공부 기록 · 10/19~10/25";
  }

  oldWeek.after(history);

  const nav = document.querySelector(".tabs");
  if (nav) {
    let pastButton = nav.querySelector('[data-x="pastweek"]');

    if (!pastButton) {
      pastButton = document.createElement("button");
      pastButton.dataset.x = "pastweek";
      pastButton.textContent = "지난주 기록";

      const weeklyButton = nav.querySelector('[data-x="w2"]');

      if (weeklyButton) {
        weeklyButton.after(pastButton);
        weeklyButton.textContent = "10/26–11/1";
      } else {
        nav.appendChild(pastButton);
      }
    }
  }

  // 날짜별 공부 계획
  // [새 ID, 표시할 강의, 지난주 같은 강의의 ID]
  const plan = [
    {
      date: "10/26 월",
      tasks: [
        ["w1026_la12", "선형대수 12강 · 블록 행렬", "w1019_la12"],
        ["w1026_c19", "C언어 19강", "w1019_c19"],
        ["w1026_c20", "C언어 20강", "w1019_c20"],
        ["w1026_py1", "Python 1강", "w1019_py1"],
        ["w1026_py2", "Python 2강", "w1019_py2"]
      ]
    },
    {
      date: "10/27 화",
      tasks: [
        ["w1027_alg27", "고등대수 27강 · 호도법과 부채꼴", "w1020_alg27"],
        ["w1027_calc6", "대학 미적분 기초 6강 · 고차방정식과 연립방정식", "w1020_cal6"],
        ["w1027_c21", "C언어 21강", "w1019_c21"],
        ["w1027_c22", "C언어 22강", "w1020_c22"],
        ["w1027_py3", "Python 3강", "w1019_py3"],
        ["w1027_py4", "Python 4강", "w1020_py4"]
      ]
    },
    {
      date: "10/28 수",
      rest: "완전 휴식 · 새 강의 및 복습 없음",
      tasks: []
    },
    {
      date: "10/29 목",
      tasks: [
        ["w1029_phy6", "고등물리 6강 · 여러 가지 운동", "w1022_phy6"],
        ["w1029_ard7", "아두이노 7강 · 조도 및 온도 센서", "w1022_ard7"],
        ["w1029_c23", "C언어 23강", "w1020_c23"],
        ["w1029_c24", "C언어 24강", "w1020_c24"],
        ["w1029_py5", "Python 5강", "w1020_py5"],
        ["w1029_py6", "Python 6강", "w1020_py6"]
      ]
    },
    {
      date: "10/30 금",
      tasks: [
        ["w1030_la13", "선형대수 13강 · 예제풀이", "w1023_la13"],
        ["w1030_alg28", "고등대수 28강 · 삼각함수의 뜻", "w1023_alg28"],
        ["w1030_c25", "C언어 25강", "w1022_c25"],
        ["w1030_c26", "C언어 26강", "w1022_c26"],
        ["w1030_py7", "Python 7강", "w1022_py7"],
        ["w1030_py8", "Python 8강", "w1022_py8"]
      ]
    },
    {
      date: "10/31 토",
      tasks: [
        ["w1031_calc7", "대학 미적분 기초 7강 · 부등식", "w1024_cal7"],
        ["w1031_phy7", "고등물리 7강 · 관성좌표계", "w1024_phy7"],
        ["w1031_ard8", "아두이노 8강 · LCD", "w1024_ard8"],
        ["w1031_c27", "선택 · C언어 27강", "w1022_c27"],
        ["w1031_py9", "선택 · Python 9강", "w1022_py9"]
      ]
    },
    {
      date: "11/1 일",
      tasks: [
        ["w1101_review1", "수학·물리 객관식 오답 복습", null],
        ["w1101_review2", "C·Python·아두이노 객관식 복습", null]
      ]
    }
  ];

  // 기존 공부 저장 키를 그대로 사용
  let saved = {};
  try {
    saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
  } catch (e) {
    console.warn("기존 체크 기록을 불러오지 못했습니다.", e);
  }

  // 이미 완료한 강의만 새 주차로 승계
  for (const day of plan) {
    for (const [newId, , oldId] of day.tasks) {
      if (
        oldId &&
        saved[newId] === undefined &&
        saved[oldId] === true
      ) {
        saved[newId] = true;
      }
    }
  }

  localStorage.setItem(SAVE_KEY, JSON.stringify(saved));

  // 계획표 HTML 구성
  oldWeek.innerHTML = "";

  const heading = document.createElement("h2");
  heading.textContent = "10/26~11/1 이번 주 공부";
  oldWeek.appendChild(heading);

  const intro = document.createElement("div");
  intro.className = "card road";
  intro.innerHTML = `
    <b>이번 주 계획</b>
    <p>
      수요일 완전 휴식 · 일요일 객관식 복습<br>
      C언어와 Python은 강의별로 체크
    </p>
    <small>
      지난주 완료된 강의는 자동으로 체크 상태를 이어받습니다.
      실제 완료 여부를 확인하지 못한 강의는 미완료 상태로 둡니다.
    </small>
  `;
  oldWeek.appendChild(intro);

  for (const day of plan) {
    const card = document.createElement("div");
    card.className = "card";

    const dateHeading = document.createElement("div");
    dateHeading.className = "date";
    dateHeading.textContent = day.date;
    card.appendChild(dateHeading);

    if (day.rest) {
      const rest = document.createElement("div");
      rest.className = "rest";
      rest.textContent = day.rest;
      card.appendChild(rest);
    }

    for (const [id, label] of day.tasks) {
      const row = document.createElement("div");
      row.className = "task";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.id = id;
      checkbox.dataset.study =
        id.includes("review") ? "0" : "1";
      checkbox.checked = saved[id] === true;

      const text = document.createElement("label");
      text.htmlFor = id;
      text.textContent = label;

      const updateStyle = () => {
        text.style.textDecoration =
          checkbox.checked ? "line-through" : "none";
        text.style.opacity =
          checkbox.checked ? "0.55" : "1";
      };

      updateStyle();

      checkbox.addEventListener("change", () => {
        saved[id] = checkbox.checked;
        localStorage.setItem(
          SAVE_KEY,
          JSON.stringify(saved)
        );
        updateStyle();
      });

      row.appendChild(checkbox);
      row.appendChild(text);
      card.appendChild(row);
    }

    oldWeek.appendChild(card);
  }

  const goals = document.createElement("div");
  goals.className = "card road";
  goals.innerHTML = `
    <b>이번 주 기본 목표</b>
    <p>
      선형대수 13강<br>
      고등대수 28강<br>
      대학 미적분 기초 7강<br>
      고등물리 7강<br>
      아두이노 8강<br>
      C언어 26강<br>
      Python 8강
    </p>
    <small>
      토요일 선택 목표: C언어 27강, Python 9강
    </small>
  `;
  oldWeek.appendChild(goals);

  // 첫 화면에 이번 주 계획 표시
  document.querySelectorAll(".week").forEach(section => {
    section.classList.remove("on");
  });

  oldWeek.classList.add("on");

  document.querySelectorAll(".tabs button").forEach(button => {
    button.classList.toggle(
      "on",
      button.dataset.x === "w2"
    );

    // 새로 추가한 지난주 버튼도 정상 작동하게 설정
    button.addEventListener("click", () => {
      document.querySelectorAll(".tabs button").forEach(b => {
        b.classList.remove("on");
      });

      document.querySelectorAll(".week").forEach(section => {
        section.classList.remove("on");
      });

      button.classList.add("on");

      const target = document.getElementById(
        button.dataset.x
      );

      if (target) {
        target.classList.add("on");
      }
    });
  });

  console.log("10/26~11/1 학습 계획 적용 완료");
})();
</script>
